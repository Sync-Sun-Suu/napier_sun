<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>振り子ハーモノグラフ (HTML5 Pendulum Harmonograph) — Hamon Studio Export</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090f1d;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    .hud {
      position: fixed;
      left: 20px;
      bottom: 20px;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
    }
    .hud strong { display: block; color: #f8fafc; font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hud">
    <strong>振り子ハーモノグラフ (HTML5 Pendulum Harmonograph)</strong>
    <span>画面をクリックまたはドラッグして操作できます（単体HTML5ファイル）</span>
  </div>
  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });
    let t = 0;
      const FX = 3;
      const FY = 2;
      let phase = 1.57;
      const DAMP = 0.0018;
      const SPEED = 5;
      const ROTARY = 0.18;

      function clearStage() {
        ctx.fillStyle = '#090f1d';
        ctx.fillRect(0, 0, width, height);
        t = 0;
      }
      clearStage();

      canvas.addEventListener('pointerdown', (e) => {
        phase = (e.clientX / width) * Math.PI * 2;
        clearStage();
      });

      function samplePoint(time) {
        const env = Math.exp(-DAMP * time);
        const R = Math.min(width, height) * 0.38 * env;
        const x = width / 2 + R * ((1 - ROTARY) * Math.sin(FX * time + phase) + ROTARY * Math.cos((FX + 1) * time));
        const y = height / 2 + R * ((1 - ROTARY) * Math.sin(FY * time) + ROTARY * Math.sin((FY + 1) * time));
        return { x, y, env };
      }

      function loop() {
        for (let i = 0; i < SPEED * 6; i++) {
          const p1 = samplePoint(t);
          t += 0.012;
          const p2 = samplePoint(t);
          if (p2.env > 0.02) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = Math.sin(t * 0.5) > 0 ? '#38bdf8' : '#818cf8';
            ctx.globalAlpha = 0.65 * p2.env;
            ctx.lineWidth = 1.3;
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(loop);
      }
      loop();
  </script>
</body>
</html>
